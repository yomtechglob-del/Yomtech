<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" width="100%" height="100%">
  <!-- Circular Soft Background Aura -->
  <circle cx="260" cy="270" r="210" fill="#E0F2FE" opacity="0.8"/>
  <circle cx="260" cy="270" r="160" fill="#BAE6FD" opacity="0.6"/>

  <!-- Standing Professional Man pointing to the right -->
  <g transform="translate(140, 100)">
    <!-- Head & Hair -->
    <path d="M70,40 Q90,20 110,40 L110,65 L70,65 Z" fill="#334155"/>
    <circle cx="90" cy="65" r="22" fill="#D29985"/>
    
    <!-- Smile & Eyes -->
    <circle cx="98" cy="62" r="2.5" fill="#1E1B18"/>
    <path d="M90,75 Q98,85 106,75" fill="none" stroke="#1E1B18" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Light Blue Shirt Body -->
    <path d="M45,105 Q90,88 135,105 L145,230 L35,230 Z" fill="#0284C7"/>
    <!-- Collar & Buttons -->
    <polygon points="90,105 80,135 90,145 100,135" fill="#FFFFFF"/>
    <circle cx="90" cy="165" r="3" fill="#FFFFFF"/>
    <circle cx="90" cy="190" r="3" fill="#FFFFFF"/>

    <!-- Left Arm Resting at Waist -->
    <path d="M45,105 L25,165 L45,175 L55,120 Z" fill="#0369A1"/>

    <!-- Right Extended Arm pointing to the right text -->
    <path d="M135,105 L220,135 L220,155 L135,135 Z" fill="#0284C7"/>
    <!-- Hand & Pointing Finger -->
    <circle cx="225" cy="145" r="10" fill="#D29985"/>
    <rect x="225" y="140" width="30" height="8" rx="4" fill="#D29985"/>

    <!-- Khaki Trousers & Legs -->
    <rect x="52" y="230" width="32" height="180" fill="#D97706"/>
    <rect x="96" y="230" width="32" height="180" fill="#D97706"/>

    <!-- Shoes -->
    <ellipse cx="68" cy="410" rx="22" ry="10" fill="#334155"/>
    <ellipse cx="112" cy="410" rx="22" ry="10" fill="#334155"/>
  </g>

  <!-- Floating Tech Skill Badges Around Person -->
  <!-- React Badge -->
  <g transform="translate(390, 80)">
    <rect x="0" y="0" width="130" height="42" rx="12" fill="#FFFFFF" stroke="#0ED3DD" stroke-width="2.5"/>
    <circle cx="25" cy="21" r="10" fill="#0ED3DD"/>
    <text x="75" y="26" text-anchor="middle" fill="#0284C7" font-family="sans-serif" font-weight="900" font-size="14">React.js</text>
  </g>

  <!-- Node.js Badge -->
  <g transform="translate(420, 180)">
    <rect x="0" y="0" width="130" height="42" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5"/>
    <circle cx="25" cy="21" r="10" fill="#10B981"/>
    <text x="75" y="26" text-anchor="middle" fill="#047857" font-family="sans-serif" font-weight="900" font-size="14">Node.js</text>
  </g>

  <!-- Python Badge -->
  <g transform="translate(390, 280)">
    <rect x="0" y="0" width="130" height="42" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="25" cy="21" r="10" fill="#F59E0B"/>
    <text x="75" y="26" text-anchor="middle" fill="#B45309" font-family="sans-serif" font-weight="900" font-size="14">Python</text>
  </g>

  <!-- AI / ML Badge -->
  <g transform="translate(420, 380)">
    <rect x="0" y="0" width="130" height="42" rx="12" fill="#FFFFFF" stroke="#A855F7" stroke-width="2.5"/>
    <circle cx="25" cy="21" r="10" fill="#A855F7"/>
    <text x="75" y="26" text-anchor="middle" fill="#6B21A8" font-family="sans-serif" font-weight="900" font-size="14">AI / ML</text>
  </g>
</svg>