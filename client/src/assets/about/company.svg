<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <!-- Isometric Background Plane -->
  <g transform="translate(400, 380) scale(1, 0.5) rotate(45)">
    <rect x="-260" y="-260" width="520" height="520" rx="30" fill="#F0F9FF" stroke="#0284C7" stroke-width="4" opacity="0.9"/>
  </g>

  <!-- Isometric Office Table -->
  <g transform="translate(400, 380) scale(1, 0.5) rotate(45)">
    <rect x="-180" y="-120" width="360" height="240" rx="20" fill="#FFFFFF" stroke="#0ED3DD" stroke-width="6"/>
  </g>

  <!-- Isometric People & Team working at table -->
  <!-- Person 1 Top -->
  <g transform="translate(380, 220)">
    <circle cx="0" cy="-20" r="16" fill="#F59E0B"/>
    <path d="M-20,0 Q0,-15 20,0 L15,40 L-15,40 Z" fill="#0284C7"/>
  </g>
  <!-- Person 2 Left -->
  <g transform="translate(250, 330)">
    <circle cx="0" cy="-20" r="16" fill="#EF4444"/>
    <path d="M-20,0 Q0,-15 20,0 L15,40 L-15,40 Z" fill="#10B981"/>
  </g>
  <!-- Person 3 Right -->
  <g transform="translate(540, 330)">
    <circle cx="0" cy="-20" r="16" fill="#10B981"/>
    <path d="M-20,0 Q0,-15 20,0 L15,40 L-15,40 Z" fill="#F59E0B"/>
  </g>

  <!-- Floating Bar Charts & Analytics (3D Isometric effect) -->
  <g transform="translate(260, 180)">
    <!-- Chart Box Base -->
    <rect x="0" y="0" width="120" height="85" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <!-- Bars -->
    <rect x="15" y="45" width="14" height="25" fill="#38BDF8"/>
    <rect x="37" y="30" width="14" height="40" fill="#0284C7"/>
    <rect x="59" y="15" width="14" height="55" fill="#0ED3DD"/>
    <rect x="81" y="25" width="14" height="45" fill="#F59E0B"/>
    <!-- Line Trend -->
    <path d="M15,45 L37,30 L59,15 L81,25" fill="none" stroke="#DC2626" stroke-width="3"/>
  </g>

  <!-- Floating Rocket Launch (Innovation Symbol) -->
  <g transform="translate(480, 100) rotate(-15)">
    <!-- Rocket Body -->
    <path d="M30,0 Q50,40 50,90 L10,90 Q10,40 30,0 Z" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <!-- Nose Cone -->
    <path d="M30,0 Q45,25 50,40 L10,40 Q15,25 30,0 Z" fill="#EF4444"/>
    <!-- Window -->
    <circle cx="30" cy="55" r="10" fill="#0ED3DD" stroke="#0284C7" stroke-width="3"/>
    <!-- Fins -->
    <path d="M10,70 L-10,100 L10,95 Z" fill="#0284C7"/>
    <path d="M50,70 L70,100 L50,95 Z" fill="#0284C7"/>
    <!-- Flame Trails -->
    <polygon points="18,90 30,130 42,90 35,115 25,115" fill="#F59E0B"/>
    <polygon points="22,90 30,120 38,90" fill="#EF4444"/>
  </g>

  <!-- Floating Pie Chart & Target Sparks -->
  <g transform="translate(560, 240)">
    <circle cx="35" cy="35" r="35" fill="#0284C7"/>
    <path d="M35,35 L35,0 A35,35 0 0,1 70,35 Z" fill="#F59E0B"/>
    <path d="M35,35 L70,35 A35,35 0 0,1 35,70 Z" fill="#10B981"/>
  </g>
</svg>