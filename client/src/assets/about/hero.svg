<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Soft Light Blue & Cyan Backdrop Ellipse -->
  <ellipse cx="450" cy="300" rx="340" ry="240" fill="#E0F2FE" opacity="0.8"/>
  <circle cx="520" cy="260" r="190" fill="#BAE6FD" opacity="0.6"/>

  <!-- Globe Background Graphic -->
  <g transform="translate(540, 240)">
    <circle cx="0" cy="0" r="160" fill="#F0F9FF" stroke="#0284C7" stroke-width="3"/>
    <!-- Lat/Long Lines -->
    <ellipse cx="0" cy="0" rx="160" ry="60" fill="none" stroke="#0ED3DD" stroke-width="2" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="160" ry="120" fill="none" stroke="#0ED3DD" stroke-width="2" opacity="0.7"/>
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#0ED3DD" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#0ED3DD" stroke-width="2" opacity="0.7"/>
    <!-- Continents Shape -->
    <path d="M-90,-40 Q-50,-90 0,-70 Q60,-100 100,-40 Q130,20 80,70 Q20,110 -60,80 Q-120,40 -90,-40 Z" fill="#38BDF8" opacity="0.4"/>
  </g>

  <!-- Central Monitor Screen -->
  <g transform="translate(180, 100)">
    <!-- Stand Base & Neck -->
    <rect x="230" y="320" width="140" height="24" rx="6" fill="#E2E8F0" stroke="#0284C7" stroke-width="2"/>
    <rect x="285" y="270" width="30" height="50" fill="#CBD5E1"/>

    <!-- Monitor Outer Body -->
    <rect x="50" y="20" width="500" height="260" rx="20" fill="#FFFFFF" stroke="#0284C7" stroke-width="4"/>
    <!-- Display Area -->
    <rect x="65" y="35" width="470" height="230" rx="12" fill="#F8FAFC"/>

    <!-- Window Top Header Bar -->
    <rect x="65" y="35" width="470" height="30" rx="12" fill="#E2E8F0"/>
    <circle cx="85" cy="50" r="5" fill="#EF4444"/>
    <circle cx="100" cy="50" r="5" fill="#F59E0B"/>
    <circle cx="115" cy="50" r="5" fill="#10B981"/>

    <!-- Code & Content Blocks inside Monitor -->
    <rect x="85" y="80" width="200" height="15" rx="4" fill="#0284C7" opacity="0.9"/>
    <rect x="85" y="105" width="300" height="10" rx="3" fill="#0ED3DD" opacity="0.8"/>
    <rect x="85" y="125" width="260" height="10" rx="3" fill="#38BDF8" opacity="0.6"/>
    <rect x="85" y="145" width="220" height="10" rx="3" fill="#38BDF8" opacity="0.4"/>

    <!-- Floating Profile Card Overlay -->
    <g transform="translate(310, 80)">
      <rect x="0" y="0" width="200" height="160" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
      <rect x="0" y="0" width="200" height="28" rx="12" fill="#0284C7"/>
      <text x="100" y="19" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="11">YOMTECH PROFILE</text>
      <!-- Avatar & Lines -->
      <circle cx="40" cy="65" r="18" fill="#F59E0B"/>
      <rect x="70" y="55" width="100" height="10" rx="3" fill="#0F172A"/>
      <rect x="70" y="72" width="70" height="8" rx="2" fill="#64748B"/>
      <!-- Content grid placeholders -->
      <rect x="20" y="100" width="160" height="40" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    </g>
  </g>

  <!-- Left Standing Person (Woman) -->
  <g transform="translate(140, 220)">
    <!-- Hair -->
    <circle cx="40" cy="40" r="22" fill="#334155"/>
    <!-- Head -->
    <circle cx="40" cy="45" r="16" fill="#8D5B4C"/>
    <!-- Body / Shirt (White Top) -->
    <path d="M22,80 Q40,65 58,80 L62,170 L18,170 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Shorts / Legs -->
    <rect x="24" y="170" width="14" height="60" fill="#0284C7"/>
    <rect x="42" y="170" width="14" height="60" fill="#0284C7"/>
    <rect x="26" y="230" width="10" height="90" fill="#8D5B4C"/>
    <rect x="44" y="230" width="10" height="90" fill="#8D5B4C"/>
    <!-- Shoes -->
    <ellipse cx="30" cy="320" rx="14" ry="6" fill="#1E293B"/>
    <ellipse cx="48" cy="320" rx="14" ry="6" fill="#1E293B"/>
  </g>

  <!-- Right Standing Person (Man) -->
  <g transform="translate(620, 230)">
    <!-- Hair -->
    <path d="M25,25 Q40,15 55,25 L55,40 L25,40 Z" fill="#334155"/>
    <!-- Head -->
    <circle cx="40" cy="45" r="16" fill="#D29985"/>
    <!-- Vest / Shirt (Red Vest) -->
    <path d="M20,78 Q40,65 60,78 L64,175 L16,175 Z" fill="#DC2626"/>
    <path d="M30,78 L50,78 L45,175 L35,175 Z" fill="#FFFFFF"/>
    <!-- Trousers -->
    <rect x="22" y="175" width="16" height="145" fill="#1E293B"/>
    <rect x="42" y="175" width="16" height="145" fill="#1E293B"/>
    <!-- Shoes -->
    <ellipse cx="30" cy="320" rx="14" ry="6" fill="#475569"/>
    <ellipse cx="50" cy="320" rx="14" ry="6" fill="#475569"/>
  </g>
</svg>