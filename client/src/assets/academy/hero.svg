<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DA1F2" />
      <stop offset="100%" stop-color="#0ED3DC" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" rx="32" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4"/>
  <circle cx="400" cy="200" r="180" fill="#1DA1F2" opacity="0.12" filter="url(#glow)"/>
  
  <!-- Desktop Screen -->
  <rect x="150" y="80" width="500" height="320" rx="16" fill="#0F172A" stroke="#1DA1F2" stroke-width="3"/>
  <rect x="170" y="100" width="460" height="240" rx="8" fill="#1E293B"/>
  
  <!-- Teacher Video Stream -->
  <rect x="190" y="120" width="280" height="200" rx="8" fill="#0A0F1D" stroke="#0ED3DC" stroke-width="2"/>
  <circle cx="330" cy="180" r="35" fill="url(#purpleGrad)"/>
  <path d="M 290 260 Q 330 220 370 260" fill="none" stroke="#0ED3DC" stroke-width="4"/>
  <text x="330" y="300" text-anchor="middle" fill="#0ED3DC" font-family="sans-serif" font-weight="bold" font-size="14">WabiSkills Live Masterclass</text>

  <!-- Live Badge -->
  <rect x="490" y="120" width="120" height="30" rx="15" fill="#EF4444"/>
  <circle cx="510" cy="135" r="5" fill="#FFFFFF"/>
  <text x="555" y="140" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="12">LIVE WORKSHOP</text>

  <!-- Code Window -->
  <rect x="490" y="160" width="120" height="160" rx="8" fill="#0A0F1D" stroke="#334155"/>
  <rect x="500" y="175" width="60" height="6" rx="3" fill="#1DA1F2"/>
  <rect x="500" y="190" width="80" height="6" rx="3" fill="#0ED3DC"/>
  <rect x="500" y="205" width="40" height="6" rx="3" fill="#A855F7"/>
  <rect x="500" y="220" width="70" height="6" rx="3" fill="#10B981"/>

  <!-- Monitor Stand -->
  <path d="M 370 400 L 430 400 L 440 460 L 360 460 Z" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <rect x="320" y="460" width="160" height="12" rx="6" fill="#334155"/>

  <!-- Student Desk & Laptop -->
  <rect x="180" y="420" width="150" height="90" rx="10" fill="#0F172A" stroke="#0ED3DC" stroke-width="2"/>
  <text x="255" y="470" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">Student Laptop</text>

  <text x="400" y="530" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="24" letter-spacing="1">WABISKILLS ACADEMY</text>
  <text x="400" y="560" text-anchor="middle" fill="#0ED3DC" font-family="sans-serif" font-weight="bold" font-size="14">Online Tech Education Platform</text>
</svg>