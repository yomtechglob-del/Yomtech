  <circle cx="400" cy="300" r="200" fill="#A855F7" opacity="0.1"/>

  <!-- AI Brain Grid -->
  <g fill="none" stroke="#A855F7" stroke-width="2">
    <circle cx="400" cy="250" r="120" stroke="#0ED3DC" stroke-width="3"/>
